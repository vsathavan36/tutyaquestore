<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store admin</title><style>body{font:16px system-ui;max-width:780px;margin:auto;padding:16px}input,textarea,select{display:block;width:100%;padding:10px;box-sizing:border-box}button{padding:12px;margin:8px;background:#075985;color:white;border:0;border-radius:8px}body{background:radial-gradient(ellipse at top,#063b56,#020b17 65%);color:#e6faff;min-height:100vh}header,footer{background:#031323;border-bottom:1px solid #167c9d}header{position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}header strong{font-size:1.35rem;letter-spacing:1px;text-shadow:0 0 18px #00bfff}main{max-width:1280px}button,a.btn{background:linear-gradient(135deg,#075985,#087f9e);border:1px solid #2caccb;transition:transform .2s,box-shadow .2s}button:hover,a.btn:hover{transform:translateY(-2px);box-shadow:0 0 18px #00bfff55}input,textarea,select{background:#0b2134;color:#e6faff;border:1px solid #23617b;border-radius:10px}input::placeholder{color:#9ac4d5}.hero{position:relative;overflow:hidden;min-height:290px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;background:radial-gradient(ellipse at 80% 15%,#1397b966,transparent 45%),linear-gradient(145deg,#031223,#07506c,#031223);border:1px solid #238bab;box-shadow:0 0 35px #00bfff22}.hero h1{font-size:clamp(2rem,5vw,4rem);max-width:680px;margin:0;text-shadow:0 0 30px #00bfff88}.hero:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 80%,#9cecff88 0 2px,transparent 4px),radial-gradient(circle at 80% 70%,#9cecff88 0 3px,transparent 5px);background-size:130px 160px,190px 230px;animation:drift 12s linear infinite}@keyframes drift{to{background-position:0 -320px,0 -460px}}.product{background:linear-gradient(160deg,#102c40,#061522);border:1px solid #21516a;box-shadow:0 8px 22px #0005;transition:transform .2s}.product:hover{transform:translateY(-4px)}.photo{background:radial-gradient(ellipse,#15546b,#061523)}.product button{margin:3px 2px;padding:8px}dialog{background:#0a2032;color:#e6faff;border:1px solid #2caccb}a{color:#68ddff}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><h1>TUTY AQUEStore Admin</h1><a href="index.html">Store</a><p>Edit catalogue, download products.json and upload it to GitHub. GitHub handles authentication.</p><select id="pick"></select><button id="new">New product</button><form id="form"><label>Name<input id="name" required></label><label>Category<input id="category" required></label><label>Price<input id="price" type="number" min="0" step=".01" required></label><label>Stock<input id="stock" type="number" min="0" required></label><label>Description<textarea id="description"></textarea></label><label>Image URL<input id="image"></label><label>Photo<input id="photo" type="file" accept="image/*"></label><button>Save draft</button><button type="button" id="delete">Delete</button></form><label>Demo catalogue<input type="checkbox" id="demo" checked></label><button id="download">Download products.json</button><a href="https://github.com/vsathavan36/tuty-aquestore/upload/main">Publish on GitHub</a><p id="status"></p><script>const $=id=>document.getElementById(id);let data={demo:true,products:[]},id=null;const fields=['name','category','price','stock','description','image'];function refresh(){ $('pick').replaceChildren(new Option('New product',''),...data.products.map(p=>new Option(p.name,p.id)));$('pick').value=id||'';let p=data.products.find(p=>p.id===id);for(let k of fields)$(k).value=p?.[k]??'';$('photo').value=''}$('pick').onchange=()=>{id=$('pick').value||null;refresh()};$('new').onclick=()=>{id=null;refresh()};$('form').onsubmit=async e=>{e.preventDefault();let p={id:id||crypto.randomUUID(),emoji:'🐠'};for(let k of fields)p[k]=['price','stock'].includes(k)?Number($(k).value):$(k).value;let f=$('photo').files[0];if(f){if(f.size>2000000){$('status').textContent='Photo must be under 2 MB';return}p.image=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}data.products=data.products.filter(x=>x.id!==p.id).concat(p);id=p.id;refresh();$('status').textContent='Draft saved'};$('delete').onclick=()=>{if(id&&confirm('Delete product?')){data.products=data.products.filter(p=>p.id!==id);id=null;refresh()}};$('download').onclick=()=>{data.demo=$('demo').checked;if(window.AdminExport){window.AdminExport.save(JSON.stringify(data,null,2));return}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='products.json';a.click()};fetch('products.json').then(r=>r.json()).then(d=>{data=d;$('demo').checked=d.demo;refresh()}).catch(()=>{$('status').textContent='Catalogue could not load; do not overwrite it.'});</script></html>
